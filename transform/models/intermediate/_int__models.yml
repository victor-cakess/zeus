version: 2

models:
  - name: int_eia__generation_hourly
    description: >
      EIA generation per (ba, period): net + gross total MWh, renewable MWh, and
      renewable share. Hourly grain preserved (aggregate late). Renewables =
      SUN + WND + WAT, computed over gross-positive generation (DECISIONS.md M-1/M-2).
    columns:
      - name: ba
        description: Balancing-authority code. Join key to NOAA weather.
        data_tests: [not_null]
      - name: period
        description: Hour of generation, UTC (timestamp_ntz).
        data_tests: [not_null]
      - name: total_net_mwh
        description: >
          Net generation across all fuel types for the hour (MWh), negatives included
          (storage charging, pumping). Use for demand-proxy / trend work.
      - name: total_gross_mwh
        description: >
          Gross production for the hour (MWh) — each fuel value clamped at 0 before
          summing. The renewable_share denominator (M-1).
      - name: renewable_gross_mwh
        description: Solar + wind + hydro gross production for the hour (MWh), clamped at 0.
      - name: renewable_share
        description: >
          renewable_gross_mwh / total_gross_mwh — in [0, 1] by construction (M-1);
          null when the BA-hour produced no gross generation.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, period]

  - name: int_eia_region__demand_hourly
    description: >
      EIA region data pivoted from (ba, period, metric) narrow to one row per
      (ba, period) wide: demand (D), the operator's day-ahead demand forecast
      (DF), net generation (NG), and total interchange (TI) as columns (M-14).
      Hourly grain preserved (aggregate late). Nulls stay null — generation-only
      BAs never report D/DF; missingness is signal (M-11 spirit).
    columns:
      - name: ba
        description: Balancing-authority code. Join key to EIA generation / NOAA weather.
        data_tests: [not_null]
      - name: period
        description: Hour, UTC (timestamp_ntz).
        data_tests: [not_null]
      - name: demand_mwh
        description: >
          Demand for the hour (MWh, metric D); null for generation-only BAs
          (expected data shape, not an error).
      - name: demand_forecast_mwh
        description: >
          The grid operator's day-ahead demand forecast for the hour (MWh,
          metric DF); null for generation-only BAs.
      - name: net_generation_mwh
        description: Net generation for the hour (MWh, metric NG).
      - name: total_interchange_mwh
        description: >
          Total interchange for the hour (MWh, metric TI) — EIA sign convention:
          positive = net exports to neighboring BAs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, period]

  - name: int_noaa__weather_daily
    description: >
      NOAA weather aggregated to (ba, observation_date) as the areal mean across the
      BA's stations. WDF2 (wind direction) dropped — circular quantity. Datatype columns
      keep their codes but are now BA-level station means. tavg is derived from
      tmax/tmin, not the raw TAVG datatype (DECISIONS.md M-3); sparse datatypes
      (snow, rhav, aslp, adpt) stay null where stations don't report them.
    columns:
      - name: ba
        description: Balancing-authority code. Join key to EIA generation.
        data_tests: [not_null]
      - name: observation_date
        description: Calendar date (station local day).
        data_tests: [not_null]
      - name: station_count
        description: Number of stations averaged into this BA-day (data-quality signal).
      - name: tmax
        description: Mean across stations of daily max temperature (°C).
      - name: tmin
        description: Mean across stations of daily min temperature (°C).
      - name: tavg
        description: >
          Derived daily average temperature (°C) — (tmax + tmin) / 2 over the BA-level
          means, NOT the raw TAVG datatype (99.9% null in our station set; M-3).
      - name: prcp
        description: Mean across stations of precipitation (mm).
      - name: snow
        description: Mean across stations of snowfall (mm).
      - name: snwd
        description: Mean across stations of snow depth (mm).
      - name: awnd
        description: Mean across stations of average daily wind speed (m/s).
      - name: wsf2
        description: Mean across stations of fastest 2-minute wind speed (m/s).
      - name: wsf5
        description: Mean across stations of fastest 5-second wind speed (m/s).
      - name: rhav
        description: Mean across stations of average relative humidity (%).
      - name: aslp
        description: Mean across stations of average sea-level pressure (hPa).
      - name: adpt
        description: Mean across stations of average dew point (°C).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, observation_date]

  - name: int_fred__prices_daily
    description: >
      FRED price series on a daily calendar spine — one row per date, one column per
      series (wide), LOCF-filled everywhere including the trailing publication lag
      (M-10). Each <series> value column has two companions: <series>_is_observed
      (boolean — true on a real observation date, false on a carry-forward) and
      <series>_staleness_days (int — days since the last real observation; 0 when
      observed, null before the series' first observation). Values are the LATEST
      REVISION, not point-in-time — using them as ML training features is forward
      leakage; as-of reconstruction is deferred (M-11). Leading-edge dates (before a
      series first published) are null in the value and staleness columns.
    columns:
      - name: date
        description: Calendar date (one row per day from the earliest observation to today).
        data_tests: [not_null]
      # 15 value columns, native units (M-9). Each has a matching _is_observed
      # (boolean) and _staleness_days (int) companion — see the model description.
      - name: wti
        description: WTI crude spot, Cushing OK ($/bbl). LOCF; daily business-day series.
      - name: brent
        description: Brent crude spot, Europe ($/bbl). LOCF; daily business-day series.
      - name: henryhub
        description: Henry Hub natural gas spot ($/MMBtu). LOCF; daily business-day series.
      - name: heatingoil
        description: No. 2 heating oil spot, NY Harbor ($/gal). LOCF; daily business-day series.
      - name: propanemt
        description: Propane spot, Mont Belvieu TX ($/gal). LOCF; daily business-day series.
      - name: jetfuel
        description: Kerosene-type jet fuel spot, US Gulf Coast ($/gal). LOCF; daily business-day series.
      - name: gasnyh
        description: Conventional gasoline spot, NY Harbor ($/gal). LOCF; daily business-day series.
      - name: gasgulf
        description: Conventional gasoline spot, US Gulf Coast ($/gal). LOCF; daily business-day series.
      - name: gasoline
        description: US regular gasoline retail ($/gal). LOCF; weekly series (Monday), ≤~7-day staleness.
      - name: diesel
        description: US diesel retail ($/gal). LOCF; weekly series (Monday), ≤~7-day staleness.
      - name: coalppi
        description: PPI coal (index 1982=100). LOCF; monthly series, ≤~31-day staleness (up to ~120 mid-revision).
      - name: natgasppi
        description: PPI natural gas (index 1982=100). LOCF; monthly series, ≤~31-day staleness (up to ~120 mid-revision).
      - name: elecppi
        description: PPI electric power (index 1982=100). LOCF; monthly series, ≤~31-day staleness (up to ~120 mid-revision).
      - name: elecprice
        description: Avg US electricity price ($/kWh). LOCF; monthly series, ≤~31-day staleness.
      - name: cpienergy
        description: CPI energy (index 1982-84=100). LOCF; monthly series, ≤~31-day staleness.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date]
