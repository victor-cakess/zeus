version: 2

models:
  - name: stg_eia__generation
    description: >
      EIA hourly generation by fuel type, deduplicated on the lookback overlap and
      standardized (respondent -> ba, value -> generation_mwh). Kept at native hourly
      grain so the duck-curve / intraday detail survives for downstream models.
    columns:
      - name: period
        description: Hour of generation, UTC (timestamp_ntz).
        data_tests: [not_null]
      - name: ba
        description: Balancing-authority code (EIA respondent). Join key to NOAA weather.
        data_tests: [not_null]
      - name: ba_name
        description: Human-readable balancing-authority name.
      - name: fuel_type
        description: EIA fuel-type code (e.g. SUN, WND, NG, COL).
        data_tests: [not_null]
      - name: fuel_type_name
        description: Human-readable fuel-type label.
      - name: generation_mwh
        description: Generation for the hour/fuel, in megawatthours.
        # Surface (warn) raw out-of-range garbage; the QC-null lands in intermediate
        # (M-8 → M-20). US48 (Lower-48 national aggregate) legitimately exceeds a per-BA
        # ceiling, so scope to non-US48; magnitude bound (generation is signed).
        data_tests:
          - dbt_utils.accepted_range:
              name: eia_generation_bounds_ba
              arguments:
                min_value: -300000
                max_value: 300000
                inclusive: true
              config:
                severity: warn
                where: "ba <> 'US48'"
      - name: value_units
        description: Source units string (constant "megawatthours").
        # Units contract — if EIA ever changes the unit, every MWh column upstream
        # of the marts is wrong; fail loudly here (verified empirically 2026-06-10).
        data_tests:
          - accepted_values:
              arguments:
                values: ["megawatthours"]
      - name: ingestion_date
        description: Date this row was ingested; used to pick the latest on dedup.
    # Output assertion of the grain spec.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, period, fuel_type]
