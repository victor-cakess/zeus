version: 2

models:
  - name: fct_generation_hourly
    description: >
      Hourly generation fact — the marts-layer materialization of
      int_eia__generation_hourly (same grain, same M-1/M-2 columns), built
      incremental so consumers stop recomputing the staging dedup over the full
      landing table. One row per (ba, period). Each run merges a trailing 10-day
      window of periods: revisions reach a period until it ages out of the 7-day
      ingestion lookback (an 8-calendar-day span), +2 days operational slack (M-5).
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['ba', 'period']
    columns:
      - name: ba
        description: Balancing-authority code.
        data_tests: [not_null]
      - name: period
        description: Hour of generation, UTC (timestamp_ntz).
        data_tests: [not_null]
      - name: total_net_mwh
        description: >
          Net generation for the hour (MWh), negatives included (storage charging,
          pumping). Use for demand-proxy / trend work (M-2).
      - name: total_gross_mwh
        description: >
          Gross production for the hour (MWh) — fuel values clamped at 0 before
          summing. The renewable_share denominator (M-1).
      - name: renewable_gross_mwh
        description: Solar + wind + hydro gross production for the hour (MWh).
      - name: renewable_share
        description: >
          renewable_gross_mwh / total_gross_mwh — in [0, 1] by construction (M-1);
          null when the BA-hour produced no gross generation.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, period]

  - name: fct_demand_hourly
    description: >
      Hourly demand fact — the marts-layer materialization of
      int_eia_region__demand_hourly (same grain, same M-14 columns), built
      incremental so consumers stop recomputing the staging dedup + pivot over
      the full landing table. One row per (ba, period). Each run merges a
      trailing 10-day window of periods: revisions reach a period until it ages
      out of eia_region's 7-day ingestion lookback (an 8-calendar-day span),
      +2 days operational slack (M-5, applied per M-16).
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: ['ba', 'period']
    columns:
      - name: ba
        description: Balancing-authority code.
        data_tests: [not_null]
      - name: period
        description: Hour, UTC (timestamp_ntz).
        data_tests: [not_null]
      - name: demand_mwh
        description: Demand for the hour (MWh, metric D); null for generation-only BAs (M-14).
      - name: demand_forecast_mwh
        description: >
          The grid operator's day-ahead demand forecast for the hour (MWh,
          metric DF); null for generation-only BAs (M-14).
      - name: net_generation_mwh
        description: Net generation for the hour (MWh, metric NG).
      - name: total_interchange_mwh
        description: >
          Total interchange for the hour (MWh, metric TI) — positive = net
          exports to neighboring BAs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, period]

  - name: fct_demand_accuracy
    description: >
      Daily forecast-accuracy scorecard — grain: one row per (ba, date,
      forecaster), LONG so Phase 4 adds forecasters as rows, never as schema
      changes (M-15). Today's only forecaster is 'eia_df' (the operators' own
      day-ahead demand forecast). Scores only hours where both demand and the
      forecast are present; BA-days with nothing to score produce no row, so
      generation-only BAs never appear. Daily metrics are ratios of the day's
      sums, not means of hourly ratios (M-6 spirit); WAPE is primary, MAPE
      secondary (near-zero-demand caveat, M-15). Plain table rebuilt from
      fct_demand_hourly each run (M-5/M-16).
    config:
      materialized: table
    columns:
      - name: ba
        description: Balancing-authority code.
        data_tests: [not_null]
      - name: date
        description: UTC calendar day of the scored periods (M-7).
        data_tests: [not_null]
      - name: forecaster
        description: >
          Who made the forecast being scored. 'eia_df' today; Phase 4 adds
          'naive' and 'zeus_v<N>' rows (M-15).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['eia_df']
      - name: wape
        description: >
          sum(|demand − forecast|) / sum(|demand|) over the day's scored hours —
          the primary accuracy metric (M-15). >= 0, unbounded above; null only
          on a degenerate all-zero-demand day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: bias_pct
        description: >
          sum(forecast − demand) / sum(|demand|) — signed; positive = the
          forecaster systematically over-forecasts (M-15).
      - name: mape
        description: >
          Mean over demand<>0 hours of |demand − forecast| / |demand| —
          secondary: near-zero-demand hours inflate it, which is why WAPE is
          primary (M-15).
      - name: hours_scored
        description: Hours of the day where both demand and forecast were present.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, date, forecaster]

  - name: fct_energy_daily
    description: >
      The cross-source daily mart: EIA generation rolled up to (ba, date) joined
      LEFT to NOAA weather (M-4). date is the UTC calendar day of period (M-7);
      weather joins on its station-local observation_date as-is. Row existence
      tracks generation — all 71 BAs appear; weather columns are null for the
      57 BAs without coverage and inside NOAA's ~3-day publication lag.
      renewable_share is the ratio of daily sums, not the mean of hourly shares
      (M-6). Demand columns join LEFT from fct_demand_hourly — null for
      generation-only BAs (M-14, same nullable policy as weather). Plain table,
      rebuilt from fct_generation_hourly each run (M-5).
    config:
      materialized: table
    columns:
      - name: ba
        description: Balancing-authority code.
        data_tests: [not_null]
      - name: date
        description: UTC calendar day of the generation periods (M-7).
        data_tests: [not_null]
      - name: total_net_mwh
        description: Daily sum of hourly net generation (MWh), negatives included.
      - name: total_gross_mwh
        description: Daily sum of hourly gross production (MWh).
      - name: renewable_gross_mwh
        description: Daily sum of hourly renewable gross production (MWh).
      - name: renewable_share
        description: >
          sum(renewable_gross_mwh) / sum(total_gross_mwh) over the day — ratio of
          sums, NOT the average of hourly shares (M-6); null when the day produced
          no gross generation.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: hours_reported
        description: >
          Distinct generation hours behind this BA-day (completeness signal —
          coverage gaps exist, worst BA ~1.2% of hours). 24 = complete day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
                inclusive: true
      - name: demand_mwh
        description: >
          Daily sum of hourly demand (MWh) over reported hours; null for
          generation-only BAs (M-14).
      - name: demand_forecast_mwh
        description: >
          Daily sum of the operator's day-ahead hourly demand forecast (MWh);
          null for generation-only BAs (M-14).
      - name: station_count
        description: >
          Stations behind the BA-day's weather means; null when no weather joined
          (uncovered BA or NOAA lag — M-4).
      - name: tmax
        description: BA-mean daily max temperature (°C); nullable (M-4).
      - name: tmin
        description: BA-mean daily min temperature (°C); nullable (M-4).
      - name: tavg
        description: Derived (tmax + tmin) / 2 over BA-level means (M-3); nullable (M-4).
      - name: prcp
        description: BA-mean precipitation (mm); nullable (M-4).
      - name: snow
        description: BA-mean snowfall (mm); null where stations don't report it (M-3/M-4).
      - name: snwd
        description: BA-mean snow depth (mm); nullable (M-3/M-4).
      - name: awnd
        description: BA-mean average daily wind speed (m/s); nullable (M-4).
      - name: wsf2
        description: BA-mean fastest 2-minute wind speed (m/s); nullable (M-4).
      - name: wsf5
        description: BA-mean fastest 5-second wind speed (m/s); nullable (M-4).
      - name: rhav
        description: BA-mean average relative humidity (%); null where unreported (M-3/M-4).
      - name: aslp
        description: BA-mean sea-level pressure (hPa); null where unreported (M-3/M-4).
      - name: adpt
        description: BA-mean dew point (°C); null where unreported (M-3/M-4).
      - name: hdd
        description: Heating degree days (°F-days, base 65°F — M-17); nullable (M-4).
      - name: cdd
        description: Cooling degree days (°F-days, base 65°F — M-17); nullable (M-4).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ba, date]

  - name: fct_fuel_prices_daily
    description: >
      The national energy-price mart — int_fred__prices_daily materialized as a plain
      table (M-5/M-12). Grain: one row per date (national, no ba). 15 price series on a
      daily LOCF spine, each with _is_observed (boolean) + _staleness_days (int)
      companions (M-11). Standalone — join to fct_energy_daily on date for prices
      beside generation (M-12). Values are latest-revision, not point-in-time: ML
      training on them is forward leakage (M-11). Full rebuild each run — PPI/CPI
      revisions rewrite old rows, so incremental buys nothing.
    config:
      materialized: table
    columns:
      - name: date
        description: Calendar date (one row per day from the earliest observation to today).
        data_tests: [not_null]
      - name: wti
        description: WTI crude spot, Cushing OK ($/bbl), LOCF-filled. + _is_observed / _staleness_days.
      - name: brent
        description: Brent crude spot ($/bbl), LOCF-filled. + _is_observed / _staleness_days.
      - name: henryhub
        description: Henry Hub natural gas spot ($/MMBtu), LOCF-filled. + _is_observed / _staleness_days.
      - name: heatingoil
        description: No. 2 heating oil spot, NY Harbor ($/gal), LOCF-filled. + _is_observed / _staleness_days.
      - name: propanemt
        description: Propane spot, Mont Belvieu TX ($/gal), LOCF-filled. + _is_observed / _staleness_days.
      - name: jetfuel
        description: Jet fuel spot, US Gulf Coast ($/gal), LOCF-filled. + _is_observed / _staleness_days.
      - name: gasnyh
        description: Gasoline spot, NY Harbor ($/gal), LOCF-filled. + _is_observed / _staleness_days.
      - name: gasgulf
        description: Gasoline spot, US Gulf Coast ($/gal), LOCF-filled. + _is_observed / _staleness_days.
      - name: gasoline
        description: US regular gasoline retail ($/gal), LOCF-filled (weekly). + _is_observed / _staleness_days.
      - name: diesel
        description: US diesel retail ($/gal), LOCF-filled (weekly). + _is_observed / _staleness_days.
      - name: coalppi
        description: PPI coal (index 1982=100), LOCF-filled (monthly). + _is_observed / _staleness_days.
      - name: natgasppi
        description: PPI natural gas (index 1982=100), LOCF-filled (monthly). + _is_observed / _staleness_days.
      - name: elecppi
        description: PPI electric power (index 1982=100), LOCF-filled (monthly). + _is_observed / _staleness_days.
      - name: elecprice
        description: Avg US electricity price ($/kWh), LOCF-filled (monthly). + _is_observed / _staleness_days.
      - name: cpienergy
        description: CPI energy (index 1982-84=100), LOCF-filled (monthly). + _is_observed / _staleness_days.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date]
