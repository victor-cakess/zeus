name: "zeus"
version: "1.0.0"
config-version: 2

# Connection profile lives in this project (profiles.yml here), driven by SNOWFLAKE_*
# env vars — the same convention the backfill scripts use. Run dbt from transform/.
profile: "zeus"

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  zeus:
    # staging: light, 1:1 with landing — dedup the lookback overlap + standardize names.
    # Views (cheap, always fresh); each layer lands in its own schema (see generate_schema_name).
    staging:
      +materialized: view
      +schema: staging
    # intermediate: reshape + per-source business logic (fuel pivot, station rollup).
    # Views so each step stays queryable for inspection. Feeds the cross-source marts.
    intermediate:
      +materialized: view
      +schema: intermediate
    # marts: the consumption surface — cross-source facts. Materialization is
    # per-model in _marts__models.yml (incremental hourly fact, plain-table daily
    # mart; DECISIONS.md M-5).
    marts:
      +schema: marts
    # reporting: the public serving surface — read-only 1:1 views over the marts,
    # the only schema the dashboard role can SELECT. Views (always fresh, cheap),
    # built into the REPORTING schema. Terraform owns the schema shell + the
    # dashboard role/user/warehouse/monitor (infra/core/snowflake_dashboard.tf);
    # dbt owns the view SQL.
    reporting:
      +materialized: view
      +schema: reporting

seeds:
  zeus:
    # Seed reference data lands in its own schema (generate_schema_name uses the
    # custom name verbatim). +schema is MANDATORY here: the prod dbt Lambda sets
    # no SNOWFLAKE_SCHEMA env var, so an unconfigured seed would land in
    # ZEUS_DEV.PUBLIC.
    +schema: seeds
    ba_centroids:
      # Explicit floats so CSV type inference can't bite.
      +column_types:
        latitude: float
        longitude: float
