[project]
name = "zeus"
version = "0.1.0"
description = "Energy project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.43.6",
    "pre-commit>=4.6.0",
    "pyarrow>=24.0.0",
    "requests>=2.32.3",
    "ruff>=0.15.12",
    "tqdm>=4.67.0",  # progress bars for the local one-off backfills
    # For the one-off Snowflake backfill (backfill/eia/snowflake_load.py), which
    # reuses src/shared/snowflake_io.py. Pins match the Lambda's requirements.txt:
    # the connector's loose bounds otherwise resolve to an incompatible
    # pyOpenSSL/cryptography pair that crashes at import.
    "snowflake-connector-python==3.12.3",
    "cryptography==43.0.3",
    "pyOpenSSL==24.2.1",
]
